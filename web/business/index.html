<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BarGo - Store Management</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top"
    >
      <div class="container">
        <a
          class="navbar-brand fw-bold d-flex align-items-center gap-2"
          href="#"
        >
          <i class="bi bi-geo-alt brand-geo" aria-hidden="true"></i>
          <span>BarGo</span>
        </a>

        <button
          class="btn btn-outline-secondary d-lg-none ms-auto me-2"
          data-bs-toggle="offcanvas"
          data-bs-target="#filtersOffcanvas"
        >
          <i class="bi bi-sliders"></i> Фильтры
        </button>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#topbar"
          aria-controls="topbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="topbar">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Поиск</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#">О нас</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Контакты</a></li>

            <!-- User dropdown -->
            <li class="nav-item dropdown ms-3" id="userNavItem">
              <a
                class="nav-link dropdown-toggle d-flex align-items-center gap-2"
                href="#"
                id="userButton"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <img
                  src="https://img.freepik.com/premium-vector/default-avatar-profile-icon-social-media-user-image-gray-avatar-icon-blank-profile-silhouette-vector-illustration_561158-3485.jpg?semt=ais_hybrid&w=740&q=80"
                  alt="User Photo"
                  class="rounded-circle"
                  width="32"
                  height="32"
                />

                <span id="userName" class="fw-semibold">Гость</span>
              </a>

              <ul class="dropdown-menu dropdown-menu-end shadow" id="userMenu">
                <li>
                  <a class="dropdown-item" href="#"
                    ><i class="bi bi-pencil-square me-2"></i>Редактировать
                    профиль</a
                  >
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item text-danger" href="#" id="logoutBtn"
                    ><i class="bi bi-box-arrow-right me-2"></i>Выйти</a
                  >
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- LOGIN / SIGNUP MODAL -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="authModalLabel">Вход в аккаунт</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Закрыть"
            ></button>
          </div>
          <div class="modal-body">
            <!-- Login Form -->
            <form id="loginForm" autocomplete="off">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="loginEmail"
                  placeholder="Введите email"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Пароль</label>
                <input
                  type="password"
                  class="form-control"
                  id="loginPassword"
                  placeholder="Введите пароль"
                  required
                />
              </div>
              <div id="loginError" class="text-danger small d-none mb-2"></div>
              <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>

            <!-- Register Form -->
            <form id="signupForm" class="d-none mt-3" autocomplete="off">
              <div class="row">
                <div class="col-md-6 mb-2">
                  <input
                    type="text"
                    class="form-control"
                    id="signupFirstname"
                    placeholder="Имя"
                    required
                  />
                </div>
                <div class="col-md-6 mb-2">
                  <input
                    type="text"
                    class="form-control"
                    id="signupLastname"
                    placeholder="Фамилия"
                    required
                  />
                </div>
              </div>
              <div class="mb-2">
                <input
                  type="email"
                  class="form-control"
                  id="signupEmail"
                  placeholder="Email"
                  required
                />
              </div>
              <div class="mb-2">
                <input
                  type="tel"
                  class="form-control"
                  id="signupPhone"
                  placeholder="Телефон"
                  required
                />
              </div>
              <div class="mb-2">
                <input
                  type="password"
                  class="form-control"
                  id="signupPassword"
                  placeholder="Пароль"
                  required
                />
              </div>
              <div id="signupError" class="text-danger small d-none mb-2"></div>
              <button type="submit" class="btn btn-success w-100">
                Создать аккаунт
              </button>
            </form>

            <!-- Switch link -->
            <div class="text-center mt-3">
              <a href="#" id="switchAuth" class="small text-primary"
                >Нет аккаунта? Зарегистрируйтесь</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Stores View -->
    <div id="storesView">
      <div class="main-header">
        <div
          class="container d-flex justify-content-between align-items-center"
        >
          <h2>Мои магазины</h2>
          <button
            class="add-btn"
            data-bs-toggle="modal"
            data-bs-target="#addStoreModal"
          >
            <i class="bi bi-plus-circle me-2"></i>Добавить магазин
          </button>
        </div>
      </div>
      <div class="container">
        <div
          class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
          id="storesGrid"
        ></div>
      </div>
    </div>

    <!-- Products View -->
    <div id="productsView" class="hidden">
      <div class="main-header">
        <div
          class="container d-flex justify-content-between align-items-center"
        >
          <div class="d-flex align-items-center gap-3">
            <button class="back-btn" onclick="backToStores()">
              <i class="bi bi-arrow-left me-2"></i>Назад
            </button>
            <h2 id="currentStoreName"></h2>
          </div>
          <button
            class="add-btn"
            data-bs-toggle="modal"
            data-bs-target="#addProductModal"
          >
            <i class="bi bi-plus-circle me-2"></i>Добавить продукт
          </button>
        </div>
      </div>
      <div class="container">
        <div
          class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
          id="productsGrid"
        >
          <!-- Product cards will be dynamically injected here by productsLoader.js -->
        </div>
      </div>
    </div>

    <!-- Add Store Modal -->
    <div class="modal fade" id="addStoreModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Добавить магазин</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addStoreForm">
              <div class="mb-3">
                <label for="storeName" class="form-label">Название</label>
                <input
                  type="text"
                  class="form-control"
                  id="storeName"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="storeAddress" class="form-label">Адрес</label>
                <input
                  type="text"
                  class="form-control"
                  id="storeAddress"
                  required
                />
              </div>
              <div class="row">
                <div class="col-6 mb-3">
                  <label for="storeLat" class="form-label">Широта</label>
                  <input
                    type="number"
                    step="any"
                    class="form-control"
                    id="storeLat"
                    required
                  />
                </div>
                <div class="col-6 mb-3">
                  <label for="storeLon" class="form-label">Долгота</label>
                  <input
                    type="number"
                    step="any"
                    class="form-control"
                    id="storeLon"
                    required
                  />
                </div>
              </div>
              <div class="mb-3">
                <label for="storeDescription" class="form-label"
                  >Описание</label
                >
                <textarea
                  class="form-control"
                  id="storeDescription"
                  rows="3"
                  required
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="storePhoto" class="form-label">URL фото</label>
                <input
                  type="url"
                  class="form-control"
                  id="storePhoto"
                  placeholder="https://..."
                  required
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Отмена
            </button>
            <button type="button" class="btn btn-primary" onclick="addStore()">
              Добавить
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Update Store Modal -->
    <div class="modal fade" id="updateStoreModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Редактировать магазин</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="updateStoreForm">
              <input type="hidden" id="updateStoreId" />
              <div class="mb-3">
                <label for="updateStoreName" class="form-label">Название</label>
                <input
                  type="text"
                  class="form-control"
                  id="updateStoreName"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="updateStoreAddress" class="form-label">Адрес</label>
                <input
                  type="text"
                  class="form-control"
                  id="updateStoreAddress"
                  required
                />
              </div>
              <div class="row">
                <div class="col-6 mb-3">
                  <label for="updateStoreLat" class="form-label">Широта</label>
                  <input
                    type="number"
                    step="any"
                    class="form-control"
                    id="updateStoreLat"
                    required
                  />
                </div>
                <div class="col-6 mb-3">
                  <label for="updateStoreLon" class="form-label">Долгота</label>
                  <input
                    type="number"
                    step="any"
                    class="form-control"
                    id="updateStoreLon"
                    required
                  />
                </div>
              </div>
              <div class="mb-3">
                <label for="updateStoreDescription" class="form-label"
                  >Описание</label
                >
                <textarea
                  class="form-control"
                  id="updateStoreDescription"
                  rows="3"
                  required
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="updateStorePhoto" class="form-label"
                  >URL фото</label
                >
                <input
                  type="url"
                  class="form-control"
                  id="updateStorePhoto"
                  required
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Отмена
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="updateStore()"
            >
              Сохранить
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Product Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Добавить продукт</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addProductForm">
              <div class="mb-3">
                <label for="productName" class="form-label">Название</label>
                <input
                  type="text"
                  class="form-control"
                  id="productName"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="productCategory" class="form-label"
                  >Категория</label
                >
                <select class="form-select" id="productCategory" required>
                  <option value="">Выберите категорию</option>
                  <option value="Еда">Еда</option>
                  <option value="Напитки">Напитки</option>
                  <option value="Электроника">Электроника</option>
                  <option value="Одежда">Одежда</option>
                  <option value="Дом и сад">Дом и сад</option>
                  <option value="Красота">Красота</option>
                  <option value="Спорт">Спорт</option>
                  <option value="Другое">Другое</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="productPrice" class="form-label">Цена (₸)</label>
                <input
                  type="number"
                  class="form-control"
                  id="productPrice"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="productDescription" class="form-label"
                  >Описание</label
                >
                <textarea
                  class="form-control"
                  id="productDescription"
                  rows="3"
                  required
                ></textarea>
              </div>

              <div class="mb-3">
                <label for="productPhoto" class="form-label">URL фото</label>
                <input
                  type="url"
                  class="form-control"
                  id="productPhoto"
                  placeholder="https://..."
                  required
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Отмена
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="addProduct()"
            >
              Добавить
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Update Product Modal -->
    <div class="modal fade" id="updateProductModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Редактировать продукт</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="updateProductForm">
              <input type="hidden" id="updateProductId" />
              <div class="mb-3">
                <label for="updateProductName" class="form-label"
                  >Название</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="updateProductName"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="updateProductCategory" class="form-label"
                  >Категория</label
                >
                <select class="form-select" id="updateProductCategory" required>
                  <option value="">Выберите категорию</option>
                  <option value="Еда">Еда</option>
                  <option value="Напитки">Напитки</option>
                  <option value="Электроника">Электроника</option>
                  <option value="Одежда">Одежда</option>
                  <option value="Дом и сад">Дом и сад</option>
                  <option value="Красота">Красота</option>
                  <option value="Спорт">Спорт</option>
                  <option value="Другое">Другое</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="updateProductPrice" class="form-label"
                  >Цена (₸)</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="updateProductPrice"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="updateProductDescription" class="form-label"
                  >Описание</label
                >
                <textarea
                  class="form-control"
                  id="updateProductDescription"
                  rows="3"
                  required
                ></textarea>
              </div>
              <div class="mb-3">
                <label for="updateProductPhoto" class="form-label"
                  >URL фото</label
                >
                <input
                  type="url"
                  class="form-control"
                  id="updateProductPhoto"
                  placeholder="https://..."
                  required
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Отмена
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="updateProduct()"
            >
              Сохранить
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS (bundle обязателен для табов) -->
    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.js"></script>

    <!-- Custom scripts -->
    <script src="auth.js"></script>
    <script src="script.js"></script>
  </body>
</html>

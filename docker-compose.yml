version: "3.9"

services:
  # ------------------------------
  # PostgreSQL Database
  # ------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: bargo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
      POSTGRES_DB: ${DB_NAME:-bargo_db}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-bargo_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------
  # Database Migration Service
  # ------------------------------
  migrate:
    image: migrate/migrate:v4.15.2
    container_name: migrate
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: [
      "-path", "/migrations/",
      "-database",
      "postgres://${DB_USER:-user}:${DB_PASSWORD:-pass}@postgres:${DB_PORT:-5432}/${DB_NAME:-bargo_db}?sslmode=disable",
      "up"
    ]
    env_file:
      - .env

  # ------------------------------
  # Authentication Service
  # ------------------------------
  auth-service:
    build:
      context: .
      dockerfile: docker/auth-service.Dockerfile
    container_name: bargo-auth
    env_file: .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${AUTH_HTTP_PORT:-3003}:3003"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5


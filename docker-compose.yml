# version: "3.9"

services:
  # ------------------------------
  # PostgreSQL Database
  # ------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: bargo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
      POSTGRES_DB: ${DB_NAME:-bargo_db}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-bargo_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------
  # Database Migration Service
  # ------------------------------
  migrate:
    image: migrate/migrate:v4.15.2
    container_name: migrate
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /migrations
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path",
        "/migrations/",
        "-database",
        "postgres://${DB_USER:-user}:${DB_PASSWORD:-pass}@postgres:${DB_PORT:-5432}/${DB_NAME:-bargo_db}?sslmode=disable",
        "up",
      ]
    env_file:
      - .env

  # ------------------------------
  # Authentication Service
  # ------------------------------
  auth-service:
    build:
      context: .
      dockerfile: docker/auth-service.Dockerfile
    container_name: bargo-auth
    env_file: .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${AUTH_HTTP_PORT:-3004}:3004"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    #   # ------------------------------
    #   # Business Service
    #   # ------------------------------
  business-service:
    build:
      context: .
      dockerfile: docker/business-service.Dockerfile
    container_name: bargo-business
    env_file: .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BUSINESS_HTTP_PORT:-3003}:3003"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    #   # ------------------------------
    #   # Consumer Service
    #   # ------------------------------
  consumer-service:
    build:
      context: .
      dockerfile: docker/consumer-service.Dockerfile
    container_name: bargo-consumer
    env_file: .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${CONSUMER_HTTP_PORT:-3002}:3002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------
  # Backend (Optional Web API Gateway)
  # ------------------------------
  consumer-web-service:
    build:
      context: .
      dockerfile: docker/consumer-web-service.Dockerfile
    container_name: consumer-web
    ports:
      - "${CONSUMER_WEB_HTTP_PORT:-3000}:3000"
    depends_on:
      - auth-service
    restart: unless-stopped
    volumes:
      - ./web/consumer:/app/web/consumer:ro

  business-web-service:
    build:
      context: .
      dockerfile: docker/business-web-service.Dockerfile
    container_name: business-web
    ports:
      - "${BUSINESS_WEB_HTTP_PORT:-3001}:3001"
    depends_on:
      - auth-service
    restart: unless-stopped
    volumes:
      - ./web/business:/app/web/business:ro

  # ------------------------------
  # OSRM - Car Profile
  # ------------------------------
  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: osrm-car
    command: osrm-routed --algorithm mld /data/kazakhstan-251102.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./map_data/car:/data
    restart: unless-stopped

  # ------------------------------
  # OSRM - Bicycle Profile
  # ------------------------------
  osrm-bike:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: osrm-bike
    command: osrm-routed --algorithm mld /data/kazakhstan-251102.osrm
    ports:
      - "5001:5000"
    volumes:
      - ./map_data/bike:/data
    restart: unless-stopped

  # ------------------------------
  # OSRM - Foot Profile
  # ------------------------------
  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: osrm-foot
    command: osrm-routed --algorithm mld /data/kazakhstan-251102.osrm
    ports:
      - "5002:5000"
    volumes:
      - ./map_data/foot:/data
    restart: unless-stopped

  # ------------------------------
  # Tile Server (Vector & Raster Maps)
  # ------------------------------
  tileserver:
    image: klokantech/tileserver-gl
    container_name: tileserver
    ports:
      - "8081:80"
    volumes:
      - ./map_data:/data
    restart: unless-stopped

# ------------------------------
# Networks & Volumes
# ------------------------------
volumes:
  postgres_data:

networks:
  default:
    driver: bridge
